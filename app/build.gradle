plugins {
    id 'com.android.application'
}

android {
    namespace 'app.zorix.browser'
    compileSdk 36

    defaultConfig {
        applicationId 'app.zorix.browser'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview-arm64-v8a:153.+'
}
