name: Bootstrap Zorix Engine
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-zorix.yml"
permissions:
  contents: write
  actions: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout seed repository
        uses: actions/checkout@v4
        with:
          path: seed

      - name: Checkout Godot 4.7.2 source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          submodules: recursive
          path: source

      - name: Overlay Zorix customization files
        run: |
          mkdir -p source/tools/zorix
          cp -a seed/tools/zorix/. source/tools/zorix/
          cp source/tools/zorix/README.template.md source/README.md
          cp source/tools/zorix/zorix_android.yml source/.github/workflows/zorix_android.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build dependencies
        working-directory: source
        run: |
          python -m pip install scons==4.10.1 cairosvg pillow
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"

      - name: Apply Zorix branding
        working-directory: source
        run: python tools/zorix/apply_branding.py

      - name: Download Swappy
        working-directory: source
        run: python misc/scripts/install_swappy_android.py

      - name: Compile arm64 Android editor
        working-directory: source
        run: |
          scons platform=android target=editor arch=arm64 production=yes dev_mode=yes module_text_server_fb_enabled=yes swappy=yes -j2

      - name: Package APK
        working-directory: source/platform/android/java
        run: ./gradlew generateGodotEditor

      - name: Normalize APK filename
        working-directory: source
        run: |
          mkdir -p dist
          APK="$(find bin/android_editor_builds -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/Zorix-Engine-4.7.2-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zorix-engine-android-apk
          path: source/dist/Zorix-Engine-4.7.2-android-arm64.apk
          retention-days: 60

      - name: Publish branded source branch
        working-directory: source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .git .github/workflows
          git init -b zorix-source
          git config user.name "Zorix Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Zorix Engine 4.7.2 branded source snapshot"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/h1collab/engine.git"
          git push --force origin zorix-source

# trigger bootstrap
