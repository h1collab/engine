name: Zorix Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/zorix/**"
      - "version.py"
      - "editor/**"
      - "platform/android/**"
      - ".github/workflows/zorix_android.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install toolchain
        run: |
          python -m pip install scons==4.10.1 cairosvg pillow
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"
      - name: Apply Zorix branding
        run: python tools/zorix/apply_branding.py
      - name: Download Swappy
        run: python misc/scripts/install_swappy_android.py
      - name: Compile arm64 Android editor
        run: |
          scons platform=android target=editor arch=arm64 production=yes dev_mode=yes module_text_server_fb_enabled=yes swappy=yes -j2
      - name: Package APK
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
      - name: Normalize APK filename
        run: |
          mkdir -p dist
          APK="$(find . -type f -name '*.apk' \( -path '*/build/outputs/apk/*' -o -path '*/android_editor_builds/*' \) | head -n 1)"
          test -n "$APK"
          echo "Using APK: $APK"
          cp "$APK" dist/Zorix-Engine-4.7.2-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zorix-engine-android-apk
          path: dist/Zorix-Engine-4.7.2-android-arm64.apk
          retention-days: 60
